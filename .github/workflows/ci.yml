name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입·구조·단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm arch
      - run: pnpm test

  # 브라우저 e2e는 시간이 오래 걸려 손으로 돌린다(Actions 탭 → CI → Run workflow).
  e2e:
    name: 브라우저 e2e (수동)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 크로미움 설치
        run: |
          npx --yes playwright@1.52.0 install --with-deps chromium
          echo "CHROMIUM_PATH=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -n1)" >> "$GITHUB_ENV"
      - name: 서버 띄우기
        run: |
          (pnpm dev:api > /tmp/api.log 2>&1 &)
          (pnpm dev:web > /tmp/web.log 2>&1 &)
          npx --yes wait-on http://localhost:8787/health http://localhost:3000 --timeout 120000
      - run: pnpm e2e
      - if: failure()
        run: tail -n 60 /tmp/api.log /tmp/web.log

